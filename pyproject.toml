[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench-openvino"
version = "0.1.0"
description = "Benchmark de desempenho de qualquer LLM em OpenVINO, em qualquer máquina Intel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Fernandes Rezende Ribeiro" }]

[project.urls]
Homepage = "https://github.com/patrickufpr/llmbench-openvino"
Repository = "https://github.com/patrickufpr/llmbench-openvino"
dependencies = ["psutil>=5.9", "py-cpuinfo>=9.0"]

[project.optional-dependencies]
# Backend OpenVINO (necessário para medir modelos reais)
openvino = [
  "openvino>=2025.0",
  "optimum[openvino]>=1.23",
  "transformers>=4.45",
  "torch",
]
dev = ["pytest>=8"]

[project.scripts]
ovbench = "ovbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
